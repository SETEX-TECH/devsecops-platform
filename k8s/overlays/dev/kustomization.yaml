apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-dev
resources:
  - ../../base
  - namespace.yaml
images:
  - name: app
    newName: localhost:5000/devsecops-app
    newTag: "initial"
replicas:
  - name: app
    count: 1
patches:
  - target: { kind: Service, name: app }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
