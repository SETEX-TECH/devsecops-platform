apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-staging
resources:
  - ../../base
  - namespace.yaml
images:
  - name: app
    newName: localhost:5000/devsecops-app
    newTag: "bf5902e353d738100ede664e4d7506ce03cd5eb6"
replicas:
  - name: app
    count: 2
patches:
  - target: { kind: Service, name: app }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
