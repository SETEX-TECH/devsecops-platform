apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-pinned-tag
      match:
        any:
          - resources: { kinds: ["Pod"], namespaces: ["app-*"] }
      validate:
        message: "Le tag 'latest' est interdit."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources: { kinds: ["Pod"], namespaces: ["app-*"] }
      validate:
        message: "Les conteneurs doivent s'exécuter en non root."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
